format: cap-cartesian-waypoints-v1
source:
  repository: BerkeleyAutomation/AUTOLab-GaP-NVIDIA-Collaboration
  revision: b7acf47f6df779eff8b911d631d6391f83e8bb37
  task: tool_sort/put_the_syringe_in_the_sharps_box
defaults:
  max_translation_speed: 0.306186218
  max_rotation_speed: 3.06186218
targets:
  hand:
    asset: robot
    control_frame: robotiq_base
    arm_action: arm_action
    gripper_action: gripper_action
    arm_joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    initial_gripper: open
waypoints:
  - name: orient
    duration: 3.0
    targets:
      hand:
        reference_frame: world
        pose: {position_xyz: [-0.14029656, -0.10000019, 1.40194142], quaternion_xyzw: [0.90495992, 0.42549685, 0.0, 0.0]}
        gripper: open
  - name: approach
    duration: 3.0
    targets:
      hand:
        reference_frame: syringe_0
        pose: {position_xyz: [-0.00009729, 0.00407383, 0.30447276], quaternion_xyzw: [-0.00000109, -0.99997767, 0.00668953, -0.00015977]}
  - name: descend
    duration: 3.0
    targets:
      hand:
        reference_frame: syringe_0
        pose: {position_xyz: [-0.00005256, 0.00220080, 0.16448528], quaternion_xyzw: [-0.00000109, -0.99997767, 0.00668953, -0.00015977]}
  - name: close
    duration: 3.0
    targets:
      hand:
        reference_frame: syringe_0
        pose: {position_xyz: [-0.00005096, 0.00213391, 0.15948573], quaternion_xyzw: [-0.00000109, -0.99997767, 0.00668953, -0.00015977]}
        gripper: closed
  - name: lift
    duration: 3.0
    targets:
      hand:
        reference_frame: syringe_0
        pose: {position_xyz: [-0.00011647, 0.00487656, 0.36446740], quaternion_xyzw: [-0.00000109, -0.99997767, 0.00668953, -0.00015977]}
  - name: rotate_upright
    duration: 3.0
    max_rotation_speed: 0.61237244
    targets:
      hand:
        reference_frame: world
        pose: {position_xyz: [0.05684574, -0.31473714, 1.15032483], quaternion_xyzw: [0.0, 0.70710678, 0.70710678, 0.0]}
  - name: over_hole
    duration: 3.0
    targets:
      hand:
        reference_frame: world
        pose: {position_xyz: [0.1975, 0.003, 1.145], quaternion_xyzw: [0.0, 0.70710678, 0.70710678, 0.0]}
  - name: lower_over_hole
    duration: 3.0
    targets:
      hand:
        reference_frame: world
        pose: {position_xyz: [0.1975, 0.003, 1.0], quaternion_xyzw: [0.0, 0.70710678, 0.70710678, 0.0]}
  - name: release
    duration: 3.0
    targets:
      hand: {reference_frame: world, gripper: open}
  - name: retract
    duration: 3.0
    targets:
      hand:
        reference_frame: world
        pose: {position_xyz: [0.1975, 0.003, 1.18], quaternion_xyzw: [0.0, 0.70710678, 0.70710678, 0.0]}
