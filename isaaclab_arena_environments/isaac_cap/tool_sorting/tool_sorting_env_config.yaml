# Shared Newton contact profile for the three easy tool-sorting levels.
default_physics_backend: newton
env_cfg_override:
  sim:
    dt: 0.02
    render_interval: 1
    gravity:
    - 0.0
    - 0.0
    - -9.81
    use_newton_actuators: true
    physics:
      num_substeps: 10
      use_cuda_graph: true
      debug_mode: false
      default_shape_cfg:
        gap: 0.002
        ke: 60000.0
        kd: 500.0
      solver_cfg:
        solver: newton
        integrator: implicitfast
        nconmax: 1024
        njmax: 1024
        iterations: 20
        ls_iterations: 20
        impratio: 10.0
        cone: elliptic
        use_mujoco_contacts: true
  decimation: 1
  scene:
    replicate_physics: true
