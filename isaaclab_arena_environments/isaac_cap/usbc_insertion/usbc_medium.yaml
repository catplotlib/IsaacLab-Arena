env_name: vabar_contact_rich_insertion__usbc_insertion_medium
embodiment:
  id: robot
  registry_name: industrial_fr3_robotiq_2f85
  params:
    initial_pose:
      position_xyz: [-0.5, -0.1, 0.912]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
    initial_joint_pose:
    - 0.07864274298115631
    - 0.3298062995394371
    - 0.044335304471795095
    - -2.5311067752004224
    - -0.05172078111771767
    - 2.860254870341865
    - 0.17028217529806985
background:
  id: table
  registry_name: usbc_insertion_fr3_table
  params:
    instance_name: table
    prim_path: "{ENV_REGEX_NS}/Table"
    initial_pose:
      position_xyz: [-0.5, -0.1, 0.912]
objects:
- id: usbc_port
  registry_name: usbc_insertion_port
  params:
    prim_path: "{ENV_REGEX_NS}/UsbcPort"
    initial_pose:
      position_xyz: [-0.05, -0.1, 0.805]
- id: usbc_plug
  registry_name: usbc_insertion_precision_plug
  params:
    prim_path: "{ENV_REGEX_NS}/UsbcPlug"
    initial_pose:
      position_xyz_min: [-0.07, -0.05, 0.7825]
      position_xyz_max: [-0.03, -0.03, 0.7825]
      rpy_min: [1.5707963267948966, 0.0, -3.141592653589793]
      rpy_max: [1.5707963267948966, 0.0, 3.141592653589793]
- id: hdr_shadow_receiver
  registry_name: usbc_insertion_hdr_shadow_receiver
  params:
    prim_path: "{ENV_REGEX_NS}/HdrShadowReceiver"
    initial_pose:
      position_xyz: [0.0, 0.0, 0.0005]
- id: sky_light
  registry_name: usbc_insertion_dome_light
  params:
    prim_path: /World/skyLight
    hdr_name: empty_warehouse_robolab
    intensity: 1500.0
    color: [0.75, 0.75, 0.75]
task:
  composition: atomic
  description: Insert the USB-C plug into the receptacle.
  subtasks:
  - kind: UsbcInsertionTask
    params:
      plug: usbc_plug
      receiver: usbc_port
      receiver_mouth_offset_xyz: [0.0, 0.0, 0.0065]
      receiver_axis: [0.0, 0.0, -1.0]
      subject_tip_offset_xyz: [0.0, 0.0, 0.00665]
      depth_min: 0.0052
      depth_max: 0.0085
      lateral_max: 0.0043965896
      speed_max: 0.05
      consecutive_success_steps: 1
      episode_length_s: 120.0
